name: Flutter Analyze

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
      - run: flutter pub get
      - name: flutter analyze
        run: |
          set +e
          dart analyze --format=machine --fatal-infos > analyze.txt 2>&1
          status=$?
          # show each issue as an annotation on the run page (visible without signing in)
          grep -E '^(INFO|WARNING|ERROR)\|' analyze.txt | while IFS='|' read -r sev type code file line col len msg; do
            level=notice; [ "$sev" = WARNING ] && level=warning; [ "$sev" = ERROR ] && level=error
            echo "::${level} file=${file#$GITHUB_WORKSPACE/},line=${line},col=${col},title=${code}::${msg}"
          done
          cat analyze.txt
          exit $status
